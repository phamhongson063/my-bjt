<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>BJT - Bài học</title>
    <link rel="stylesheet" href="asset/css/lesson.css" />
  </head>
  <body>
    <div class="nav"><a href="index.html">← Trang chủ</a></div>

    <div id="loading">Đang tải bài học...</div>
    <div id="error" class="hidden" style="color: red"></div>

    <div id="loginRequired" class="login-required hidden">
      <p>
        ⚠️ Bạn chưa đăng nhập. Có thể xem nội dung nhưng
        <b>không thể lưu tiến độ</b>.
        <a href="index.html">Đăng nhập tại đây</a>.
      </p>
    </div>

    <div id="lessonContent" class="hidden">
      <div class="user-bar hidden" id="userBar">
        👤 <span id="userEmail"></span> |
        <a href="#" id="logoutBtn">Đăng xuất</a>
      </div>

      <div class="header">
        <h1 id="lessonTitle"></h1>
        <div class="vi" id="lessonTitleVi"></div>
        <div class="meta" id="lessonMeta"></div>
      </div>

      <div class="intro" id="lessonIntro"></div>

      <a
        class="study-clock"
        id="studyClock"
        href="study.html"
        title="Thời gian học bài này — bấm để xem trang thống kê"
        aria-label="Xem trang thống kê giờ học"
      >
        <span id="studyClockTime">00:00</span>
        <span
          class="study-clock-dot"
          id="studyClockDot"
          role="status"
        ></span>
      </a>

      <button
        id="savePosFab"
        class="save-pos-fab"
        type="button"
        title="Lưu vị trí đọc hiện tại"
      ></button>
      <button
        id="pauseToggle"
        class="pause-fab"
        type="button"
        aria-pressed="false"
        title="Tạm dừng tính giờ (toàn cục)"
      ></button>
      <button
        id="scrollTopFab"
        class="scroll-top-fab"
        type="button"
        title="Lên đầu trang"
        aria-label="Lên đầu trang"
      ></button>

      <div class="settings-bar" id="settingsBar">
        <span class="group-label">⚙️</span>
        <label
          >Font
          <select id="fontSize">
            <option value="14">Nhỏ</option>
            <option value="16" selected>Vừa</option>
            <option value="18">Lớn</option>
            <option value="20">Rất lớn</option>
          </select>
        </label>
        <label title="Ẩn hết tiếng Việt trong quiz/reading, sát đề thi thật">
          <input type="checkbox" id="examMode" /> 🇯🇵 Exam mode
        </label>
        <label title="Ngôn ngữ phần giải thích (note/tips/explanation)"
          >Giải thích
          <select id="explainLang">
            <option value="vi">🇻🇳 VN</option>
            <option value="jp">🇯🇵 JP</option>
            <option value="both">🌐 Cả hai</option>
          </select>
        </label>
        <span style="color: #ccc">|</span>
        <span class="group-label">🔊</span>
        <label
          >Tốc độ
          <select id="ttsRate">
            <option value="0.7">0.7x</option>
            <option value="0.85">0.85x</option>
            <option value="0.95" selected>0.95x</option>
            <option value="1.0">1.0x</option>
            <option value="1.15">1.15x</option>
          </select>
        </label>
        <label
          >Giọng
          <select id="ttsVoice">
            <option>Đang tải...</option>
          </select></label
        >
        <button id="stopAudioBtn" class="stop-btn">⏹ Dừng</button>
        <span id="ttsStatus" style="color: #666"></span>
      </div>

      <nav
        id="lessonToc"
        class="lesson-toc hidden"
        aria-label="Mục lục bài học"
      >
        <button
          type="button"
          class="toc-toggle"
          id="tocToggle"
          title="Mục lục — click để mở/đóng"
          aria-expanded="false"
        >
          📑<span class="toc-label">Mục lục</span>
        </button>
        <div class="toc-list" id="tocList"></div>
      </nav>

      <div id="sectionsContainer"></div>

      <div id="completeArea" class="hidden">
        <button id="completeBtn" class="complete-btn">
          ✓ Đánh dấu hoàn thành bài này
        </button>
        <div id="completeStatus" class="complete-status hidden"></div>
      </div>
    </div>

    <script type="module" src="asset/script/lesson.js"></script>
  </body>
</html>
